name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      # Predates the code and outlives it: CLAUDE.md is mostly pointers into the plan of
      # record, and a pointer that has rotted sends the next agent to a section that no
      # longer says what it is cited as saying.
      - name: Docs
        run: make check-docs
      - name: Lint
        run: python -m ruff check src tests tools
      - name: Format check
        run: python -m ruff format --check src tests tools
      - name: Types
        run: python -m mypy
      - name: Generated client is current
        run: python tools/generate_adp_client.py --check
      - name: Test
        run: python -m pytest -m "not contract and not harbor"
