# The live-ADP suite. Kept out of ci.yml because it needs a database, a server,
# and two bootstrapped principals — and because a green `ci` should not depend
# on another project's checkout being reachable.
#
# ADP is pinned by commit rather than by branch. The whole value of a contract
# test is knowing which contract it passed against, and "whatever main was that
# morning" is not an answer.
#
# It failed every run from its creation until 2026-10: ADP's config refuses to
# load without GIT_ROOT, SIGNING_KEY, PUBLIC_URL and MIRROR_CREDENTIAL_KEY, so
# even `migrate` exited before touching the database. The ADP env block below is
# the one DeDuva/adp-replay's ci.yml `contract` job uses, and ADP is started the
# same way (`npx tsx src/main.ts`) — `npm start` runs `node dist/main.js`, and
# nothing here builds dist/.
name: adp-contract

on:
  workflow_dispatch:
  schedule:
    # Weekly, because a contract that broke is worth finding out about before
    # the next study rather than during it.
    - cron: "17 6 * * 1"

permissions:
  contents: read

env:
  # The contract this checkout's client was generated against. Moving it means
  # re-vendoring the spec and regenerating (make sync-spec generate). Kept equal
  # to DeDuva/adp-replay's ADP_REF so the two clients are tested against one ADP.
  ADP_REF: 3404ed4a8b6bc3d47ec48e41bcb1b93427d37cda

jobs:
  contract:
    runs-on: ubuntu-latest
    env:
      # Every ADP entry point (migrate, bootstrap, main) loads the same config,
      # so the whole block is job-level rather than repeated per step.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/adp
      GIT_ROOT: ${{ github.workspace }}/.adp-git
      PORT: "3000"
      PUBLIC_URL: http://localhost:3000
      # Throwaway keys for a throwaway instance. They have to be *present*
      # because ADP refuses to start unsigned, which is the right default;
      # nothing here outlives the job.
      SIGNING_KEY: ci-contract-signing-key
      MIRROR_CREDENTIAL_KEY: ci-contract-mirror-key
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: adp
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: duva-bench

      - uses: actions/checkout@v4
        with:
          repository: DeDuva/adp
          ref: ${{ env.ADP_REF }}
          path: adp

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ADP
        working-directory: adp/server
        run: npm ci

      - name: Migrate
        working-directory: adp/server
        run: |
          mkdir -p "$GIT_ROOT"
          npx tsx src/db/migrate.ts

      - name: Start ADP
        working-directory: adp/server
        run: |
          npx tsx src/main.ts > "$RUNNER_TEMP/adp.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:3000/readyz && exit 0
            sleep 1
          done
          # A loop that falls through silently leaves every later step to fail
          # with "connection refused" and no clue why.
          echo "::error::ADP did not become ready within 60s"
          cat "$RUNNER_TEMP/adp.log"
          exit 1

      - name: Bootstrap two principals
        working-directory: adp/server
        run: |
          # Two principals, not one principal with two tokens: ADP decides
          # `separately_authorized` by comparing principals, so a second token
          # for the same identity would make every score a self-report.
          runner=$(npx tsx src/bootstrap.ts duva-runner | awk '/^Token:/ {print $2}')
          grader=$(npx tsx src/bootstrap.ts duva-grader | awk '/^Token:/ {print $2}')
          echo "::add-mask::$runner"
          echo "::add-mask::$grader"
          echo "DUVA_ADP_RUNNER_TOKEN=$runner" >> "$GITHUB_ENV"
          echo "DUVA_ADP_GRADER_TOKEN=$grader" >> "$GITHUB_ENV"

      - name: Create the contract repository
        env:
          BASE: http://localhost:3000
        run: |
          # Repositories, like intents, only exist on the compat plane.
          curl -sf -X POST "$BASE/api/v3/user/repos" \
            -H "Authorization: Bearer $DUVA_ADP_RUNNER_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"name":"bench-contract"}'

      - name: Install duva-bench
        working-directory: duva-bench
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Contract suite
        working-directory: duva-bench
        env:
          DUVA_ADP_BASE_URL: http://localhost:3000
          DUVA_ADP_OWNER: duva-runner
          DUVA_ADP_REPO: bench-contract
          DUVA_ADP_DB_URL: postgres://postgres:postgres@localhost:5432/adp
        run: make test-contract
