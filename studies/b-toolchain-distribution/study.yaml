# Study B pilot — one problem per task, posed in four toolchains.
#
# The design is docs/studies/b-toolchain-distribution.md. One model, one
# harness, four substrates, no documentation variation.
#
# **Two of the four are twins**, and that is the point of this revision. A twin
# is `oss` with every user-visible name replaced by a pronounceable non-word and
# nothing else changed, so twin-minus-oss is a familiarity effect. Two twins
# drawn from different seeds are the *same* treatment under two arbitrary
# vocabularies, so twin-minus-twin-b is the instrument's own noise — the floor
# every other contrast has to clear, and the one `oss` cannot supply because it
# differs from the twins in something real.
#
# The first pilot ran on claude-sonnet-4-5 and every arm solved every task twice
# — pooled within-cell sd 0.0, no outcome signal, nothing to divide a contrast
# by. Four calibration rounds then established that the saturation was the
# model rather than the tasks: with corrected specs sonnet passes every task
# 6/6, while claude-haiku-4-5 passes use-validator 3/5 for reasons that are the
# task's own.
#
# So this runs on the smaller model. use-validator carries the outcome axis;
# add-median is marginal at 4/5; fix-spread and strict-mode sit at ceiling and
# are here as matched controls — an effect that shows up on those is not about
# difficulty. Five repetitions, because two give a spread and not a variance.
#
# It is still a pilot. Its job is an effect size and a noise floor, and the
# report prints both floors before any contrast is read.
#
# The four arms differ in exactly one factor: the substrate each runs. Same
# model, same harness, same (absent) toolset, same environment. 4 tasks × 4 arms
# × 5 repetitions = 80 trials; pilot 2 cost $0.208 a trial, so the cap is set
# above the ~$16.6 that implies rather than at it.

title: duva-bench Study B pilot 3 — toolchain familiarity, with the instrument's own floor

adp:
  owner: duva
  repo: bench-studyb2
  orchestrator: duva-bench

tasks:
  - id: use-validator
    substrates:
      oss: tasks/use-validator-oss
      twin: tasks/use-validator-twin
      twin-b: tasks/use-validator-twin-b
      proprietary: tasks/use-validator-proprietary
    grader_path: graders/use-validator.py
    grader_sha256: "1a66753c1279aa442230834fb0786610a0c9e514628eb8d9a5181588f65680cc"
  - id: add-median
    substrates:
      oss: tasks/add-median-oss
      twin: tasks/add-median-twin
      twin-b: tasks/add-median-twin-b
      proprietary: tasks/add-median-proprietary
    grader_path: graders/add-median.py
    grader_sha256: "c6d125c708437a3f054ba83f2d635cc07f5fe628188b58a6a3af39c69801dcd5"
  - id: fix-spread
    substrates:
      oss: tasks/fix-spread-oss
      twin: tasks/fix-spread-twin
      twin-b: tasks/fix-spread-twin-b
      proprietary: tasks/fix-spread-proprietary
    grader_path: graders/fix-spread.py
    grader_sha256: "f6f87be6d33a2cede97677c3f92d3f70db3967f660068eb9196c50d6f4660675"
  - id: strict-mode
    substrates:
      oss: tasks/strict-mode-oss
      twin: tasks/strict-mode-twin
      twin-b: tasks/strict-mode-twin-b
      proprietary: tasks/strict-mode-proprietary
    grader_path: graders/strict-mode.py
    grader_sha256: "e9709ac7e0468adc857b6e7856dc1db06156b51801d05d9893828c03fb29c2b2"

arms:
  - id: oss
    substrate: oss
    foreign_commands:
      - dbuild
      - mapu
      - pytest
      - tove
    model:
      provider: anthropic
      model: claude-haiku-4-5-20251001
      parameters:
        temperature: "0"
    harness:
      agent: terminus-2
      version: "0.20.0"
    toolset:
      name: shell
      docs_bundle:
        grade: none
    env:
      LANG: C.UTF-8
  - id: twin
    substrate: twin
    foreign_commands:
      - dbuild
      - make
      - pytest
      - tove
    model:
      provider: anthropic
      model: claude-haiku-4-5-20251001
      parameters:
        temperature: "0"
    harness:
      agent: terminus-2
      version: "0.20.0"
    toolset:
      name: shell
      docs_bundle:
        grade: none
    env:
      LANG: C.UTF-8
  - id: twin-b
    substrate: twin-b
    foreign_commands:
      - dbuild
      - make
      - mapu
      - pytest
    model:
      provider: anthropic
      model: claude-haiku-4-5-20251001
      parameters:
        temperature: "0"
    harness:
      agent: terminus-2
      version: "0.20.0"
    toolset:
      name: shell
      docs_bundle:
        grade: none
    env:
      LANG: C.UTF-8
  - id: proprietary
    substrate: proprietary
    foreign_commands:
      - make
      - mapu
      - pytest
      - tove
    model:
      provider: anthropic
      model: claude-haiku-4-5-20251001
      parameters:
        temperature: "0"
    harness:
      agent: terminus-2
      version: "0.20.0"
    toolset:
      name: shell
      docs_bundle:
        grade: none
    env:
      LANG: C.UTF-8

repetitions: 5
budget_usd_cap: "22.00"
concurrency: 3
provider_rate_limits:
  anthropic: 30

pre_registration:
  primary_metric: process:escaped
  secondary_metrics:
    - acceptance
    - discipline
    - process:escape_to_familiar_rate
  repetitions: 5
  control_arm: oss
  instrument_arms:
    - twin
    - twin-b
  exclusion_rules:
    - A trial whose ADP /verify is not ok:true is ERROR and is excluded from statistics, counted separately.
    - A trial whose grader crashed is unscored and is excluded from that axis, never scored zero.
    - The two twins are the same treatment under two arbitrary vocabularies, so the gap between them is the instrument's own noise. It is reported before any contrast, and a contrast that does not exceed it is not interpreted — including a twin-versus-oss contrast, which is partly the floor itself.
    - Pass rate is a gate on work having been done, not the measure. It is reported as a stratification and never as an exclusion — dropping failed trials from an escape analysis would condition on a variable escaping itself causes, and would remove escapers from the arms that escape most.
  metaprogramming_allowed: true
  amendments:
    - date: "2026-08-11"
      field: primary_metric
      previous: acceptance
      rationale: >-
        Amendment 1, design doc §7.1. Pass rate cannot carry this study: four
        calibration rounds and seven tasks produced no task that discriminates,
        and every point of apparent difficulty traced to an authoring defect.
        The primary measure becomes `escaped` — whether a trial invoked a
        toolchain its arm was not given — which is behavioural, mechanistic, and
        does not require a failable task, removing task authoring as the binding
        constraint. It also does not saturate when the model improves, which
        pass rate will. Registered before the trials that test it and after the
        trials that suggested it; H5 (partial unfamiliarity costs more than
        total) was generated by inspecting pilot 2 and must be tested on fresh
        tasks and a fresh run, never reported from the data that suggested it.
    - date: "2026-08-11"
      field: secondary_metrics
      previous:
        - discipline
      rationale: >-
        Acceptance moves to secondary under the same amendment, so the
        pre-amendment reading of this study stays computable and both are
        printed. The per-call escape rate joins it: the trial is the unit of the
        primary metric, and the rate beside it is what says whether a trial
        escaped once or spent itself doing so.
    - date: "2026-08-11"
      field: exclusion_rules
      previous:
        - A trial whose ADP /verify is not ok:true is ERROR and is excluded from statistics, counted separately.
        - A trial whose grader crashed is unscored and is excluded from that axis, never scored zero.
        - The twin arm is the instrument's own control; a difference between twin and oss is measurement noise or a familiarity effect, and the report states the noise floor before either is read.
      rationale: >-
        States what "pass rate becomes a gate" means operationally, because the
        obvious reading of it is a mistake: excluding failed trials conditions
        on a collider. Escaping causes failing, so gating on the outcome
        preferentially deletes escapers from exactly the arms the hypothesis
        says escape most, biasing the primary metric toward the null by an
        amount that differs per arm.
    - date: "2026-08-11"
      field: instrument_arms
      previous: null
      rationale: >-
        Amendment 1 said the twin-minus-oss contrast is the noise floor and that
        no contrast is interpreted which does not exceed it. That is wrong for
        `escaped`: `oss` differs from the twins in something real, so its
        contrast bounds the effect from above rather than reading the floor. A
        second twin on a different seed is the reading that was wanted — twin
        and twin-b are the same treatment under two arbitrary vocabularies, so
        whatever separates them is the instrument. Registered before either twin
        has run.
    - date: "2026-08-11"
      field: exclusion_rules
      previous:
        - A trial whose ADP /verify is not ok:true is ERROR and is excluded from statistics, counted separately.
        - A trial whose grader crashed is unscored and is excluded from that axis, never scored zero.
        - The twin arm is the instrument's own control; a difference between twin and oss is measurement noise or a familiarity effect, and the report states the noise floor before either is read.
        - Pass rate is a gate on work having been done, not the measure. It is reported as a stratification and never as an exclusion — dropping failed trials from an escape analysis would condition on a variable escaping itself causes, and would remove escapers from the arms that escape most.
      rationale: >-
        Replaces the single-twin rule with the two-twin one it turned out to
        need, in the same edit that registers `instrument_arms`.
