budget_usd_cap: '250.00'
concurrency: 8
pre_registration:
  control_arm: standard-sonnet-terminus
  exclusion_rules:
  - 'A trial whose ADP /verify is not ok:true is ERROR: excluded from every statistic,
    counted separately, never a failure.'
  - A trial whose grader did not produce a result is unscored on that axis and enters
    no cell; it is never scored zero.
  - A repetition verdict is a majority over the cell's repetitions with ERROR trials
    counting against, so an arm cannot improve its record by failing to produce evidence.
  - No trial is excluded for its result. Only the two conditions above remove a trial
    from a statistic.
  metaprogramming_allowed: true
  primary_metric: process:hallucinated_call_rate
  repetitions: 5
  secondary_metrics:
  - acceptance
  - process:tool_error_rate
  - process:metaprogramming_rate
provider_rate_limits:
  anthropic: 20
repetitions: 5
